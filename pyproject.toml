[project]
name = "home-automation-agent"
version = "0.1.0a2"
description = "A lightweight bridge between Home Assistant and the Semantic Home backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.0",
]

[project.scripts]
home-automation-agent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
